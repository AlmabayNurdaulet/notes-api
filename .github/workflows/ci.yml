name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Run project tests
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: ./scripts/test.sh
