name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Run project tests
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: ./scripts/test.sh

  publish:
    name: Build, scan and publish the image
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Name the image in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the runtime user and image size
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE:$GITHUB_SHA" -u)
          test "$uid" != "0"
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE:$GITHUB_SHA")
          echo "Runtime UID: $uid; image size: $size bytes"
          test "$size" -lt 500000000

      - name: Smoke test on a non-default port
        run: |
          docker run -d --name app -e PORT=9123 -p 9123:9123 "$IMAGE:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 15 --retry-delay 1 \
            --retry-all-errors --retry-max-time 25 --max-time 2 \
            http://localhost:9123/healthz

      - name: Scan for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          cache-dir: ${{ runner.temp }}/trivy
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact image that passed the smoke test and scan, without rebuilding.
      - name: Publish the tested image by commit SHA and latest
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Show container logs on failure
        if: failure()
        run: docker logs app || true

      - name: Stop the smoke-test container
        if: always()
        run: docker rm -f app || true
